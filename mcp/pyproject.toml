[project]
name = "belgian-legal-lexicon-mcp"
version = "1.2.0"
description = "Read-only MCP server for the Belgian legal lexicon, Dutch-French (procedure)"
readme = "README.md"
license = "CC-BY-4.0"
authors = [{ name = "Philippe Lognoul" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
belgian-legal-lexicon-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/philippelognoul/belgian-legal-lexicon-nl-fr"
DOI = "https://doi.org/10.5281/zenodo.24416443"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
